[project]
name = "llm-bot"
version = "0.5.0"
description = "AI Multi-Platform Bot & Admin Panel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aerich==0.9.2",
    "aiofiles==24.1.0",
    "aiogram==3.15.0",
    "aiosqlite==0.22.1",
    "asyncpg==0.30.0",
    "bcrypt==5.0.0",
    "discord.py[voice]>=2.7.1",
    "davey>=0.1.0",
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "jinja2==3.1.5",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.9",
    "tortoise-orm==0.25.3",
    "uvicorn[standard]==0.40.0",
    "yt-dlp>=2025.7.21",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "tomlkit==0.14.0"]

[tool.aerich]
tortoise_orm = "src.database.config.CONFIG"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
